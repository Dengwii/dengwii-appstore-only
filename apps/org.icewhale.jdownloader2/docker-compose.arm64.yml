name: dengwii-appstore-only-jdownloader2
services:
  jdownloader2:
    image: jlesage/jdownloader-2:latest@sha256:61d6ecd204da56225856060747cba6e29dd70a2dcdf075dfaeb118c4f37ddfce
    restart: unless-stopped
    environment:
      - USER_ID=$PUID
      - GROUP_ID=$PGID
      - TZ=$TZ
      - MYJDOWNLOADER_EMAIL=$MYJDOWNLOADER_EMAIL
      - MYJDOWNLOADER_PASSWORD=$MYJDOWNLOADER_PASSWORD
      - MYJDOWNLOADER_DEVICE_NAME=$MYJDOWNLOADER_DEVICE_NAME
      - JDOWNLOADER_HEADLESS=$JDOWNLOADER_HEADLESS
    ports:
      - target: 5800
        published: "5800"
        protocol: tcp
      - target: 5900
        published: "5900"
        protocol: tcp
      - target: 3129
        published: "3129"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/jdownloader2/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /output
    container_name: jdownloader2
x-casaos:
  id: org.icewhale.jdownloader2
  main: jdownloader2
  icon: https://cdn.jsdelivr.net/gh/Dengwii/dengwii-appstore-only@gh-pages/apps/org.icewhale.jdownloader2/assets/icon.svg
  port_map: "5800"
  scheme: http
  title:
    en_US: JDownloader2
  version: "26.3.1"
