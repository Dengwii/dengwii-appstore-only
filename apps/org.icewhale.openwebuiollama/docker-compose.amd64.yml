name: dengwii-appstore-only-open-webui-ollama
services:
  open-webui-ollama:
    image: ghcr.io/open-webui/open-webui:ollama@sha256:1fde3d29311e5c5036cc6cf1d3fdda25ebc25d3be6a76832e049283c62445193
    runtime: nvidia
    ipc: host
    environment:
      CPU_FALLBACK: "true"
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          memory: "512M"
    network_mode: bridge
    ports:
      - target: 8080
        published: "3050"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/open-webui-ollama/open-webui
        target: /app/backend/data
      - type: bind
        source: /DATA/AppData/open-webui-ollama/ollama
        target: /root/.ollama
    privileged: false
    container_name: open-webui-ollama
x-casaos:
  id: org.icewhale.openwebuiollama
  main: open-webui-ollama
  icon: https://cdn.jsdelivr.net/gh/Dengwii/dengwii-appstore-only@gh-pages/apps/org.icewhale.openwebuiollama/assets/icon.svg
  scheme: http
  title:
    en_US: Open WebUI
    en_GB: Open WebUI
    zh_CN: Open WebUI
    ja_JP: Open WebUI
  index: /
  port_map: "3050"
  version: "0.9.6"
