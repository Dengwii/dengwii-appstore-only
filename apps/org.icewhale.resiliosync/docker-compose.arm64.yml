name: dengwii-appstore-only-resilio-sync
services:
  resilio-sync:
    environment:
      - PGID=$PGID
      - PUID=$PUID
      - TZ=$TZ
    image: linuxserver/resilio-sync:3.1.2@sha256:615094d2ba34c52003a45807db172b44214bc0f1e23ac0a2f9f297c27f36c646
    network_mode: bridge
    ports:
      - target: 55555
        published: "55555"
        protocol: tcp
      - target: 8888
        published: "8888"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /sync
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    privileged: false
    container_name: resilio-sync
x-casaos:
  id: org.icewhale.resiliosync
  icon: https://cdn.jsdelivr.net/gh/Dengwii/dengwii-appstore-only@gh-pages/apps/org.icewhale.resiliosync/assets/icon.svg
  index: /
  port_map: "8888"
  scheme: http
  title:
    en_US: resilio-sync
  version: "3.1.2"
