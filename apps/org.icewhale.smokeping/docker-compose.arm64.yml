name: dengwii-appstore-only-smokeping
services:
  smokeping:
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
    image: linuxserver/smokeping:2.9.0@sha256:aaadae6ec69488bdeef4db33fd8fd78254d1fd6349b34c5579ca228e89879dc3
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 80
        published: "10280"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/smokeping/config
        target: /config
      - type: bind
        source: /DATA/AppData/smokeping/data
        target: /data
    container_name: smokeping
x-casaos:
  id: org.icewhale.smokeping
  main: smokeping
  icon: https://cdn.jsdelivr.net/gh/Dengwii/dengwii-appstore-only@gh-pages/apps/org.icewhale.smokeping/assets/icon.svg
  title:
    en_US: Smokeping
  port_map: "10280"
  version: "2.9.0"
